<aside
  id="app-sidebar"
  class="sidebar"
  [class.sidebar--drawer]="asDrawer()"
  [class.sidebar--open]="open()"
  [attr.aria-hidden]="asDrawer() && !open() ? true : null"
  [inert]="asDrawer() && !open()"
>
  <div class="sidebar__brand">
    <p class="sidebar__product">Portal Genie Admin</p>
    <p class="sidebar__hint">Internal administration</p>
  </div>

  <p class="sidebar__section" id="nav-engagement-label">Customer Engagement</p>
  <nav class="sidebar__nav" aria-labelledby="nav-engagement-label">
    <ul class="sidebar__list">
      @for (item of items; track item.route) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.route"
            routerLinkActive="is-active"
            (click)="onNavigate()"
          >
            <span class="sidebar__icon" aria-hidden="true">
              @switch (item.icon) {
                @case ('rules') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11H4a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h5" />
                    <path d="M15 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-5" />
                    <path d="M9 7h6" />
                    <path d="M9 12h6" />
                    <path d="M9 17h6" />
                  </svg>
                }
                @case ('templates') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" x2="8" y1="13" y2="13" />
                    <line x1="16" x2="8" y1="17" y2="17" />
                    <line x1="10" x2="8" y1="9" y2="9" />
                  </svg>
                }
              }
            </span>
            <span class="sidebar__label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
