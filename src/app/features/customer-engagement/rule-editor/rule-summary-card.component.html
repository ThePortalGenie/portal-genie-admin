<section class="rule-preview" aria-labelledby="rule-preview-heading" aria-live="polite">
  <h2 id="rule-preview-heading">This rule will…</h2>

  @if (preview().isReadable) {
    <p class="rule-preview__body">
      @for (line of preview().lines; track $index; let last = $last) {
        <span>{{ line }}{{ last ? '' : ',' }}</span>
        @if (!last) {
          <br />
        }
      }
    </p>
  }

  @if (preview().guidance; as guidance) {
    <p class="rule-preview__guidance">{{ guidance }}</p>
  }
</section>
