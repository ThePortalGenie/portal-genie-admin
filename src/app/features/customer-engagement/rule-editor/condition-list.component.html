<div class="condition-list">
  <div class="pg-field combinator">
    <label class="pg-label" for="condition-combinator">Match</label>
    <select class="pg-select" id="condition-combinator" [formControl]="combinator()">
      <option value="and">All of these conditions</option>
      <option value="or">Any of these conditions</option>
    </select>
  </div>

  @if (groupIssue(); as issue) {
    <ui-validation-message [message]="issue.message" />
  }

  <ul class="when-stack">
    @for (condition of conditions().controls; track condition.controls.id.value; let index = $index) {
      @if (index > 0) {
        <li class="when-join">
          <span>{{ joinLabel(index) }}</span>
        </li>
      }
      <li class="when-card">
        @if (index === 0) {
          <p class="when-card__lead">A customer</p>
        }
        <app-condition-row
          [group]="condition"
          [metrics]="metrics()"
          [issues]="issuesFor(index)"
          [showErrors]="showErrors()"
          [audienceOnly]="audienceOnly()"
          (remove)="remove.emit(index)"
        />
      </li>
    }
  </ul>

  <ui-button variant="secondary" (click)="add.emit()">+ Add another condition</ui-button>
</div>
