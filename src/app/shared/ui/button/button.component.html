<button
  class="ui-button"
  [class.ui-button--primary]="variant() === 'primary'"
  [class.ui-button--secondary]="variant() === 'secondary'"
  [class.ui-button--ghost]="variant() === 'ghost'"
  [class.ui-button--destructive]="variant() === 'destructive'"
  [class.ui-button--compact]="size() === 'compact'"
  [attr.type]="type()"
  [attr.aria-label]="ariaLabel() ?? null"
  [disabled]="disabled()"
>
  <ng-content />
</button>
