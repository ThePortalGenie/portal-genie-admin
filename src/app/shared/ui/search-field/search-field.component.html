<div class="ui-search">
  <label class="ui-search__label" [attr.for]="fieldId">{{ label() }}</label>
  <input
    class="ui-search__input"
    type="search"
    [id]="fieldId"
    [value]="value()"
    [attr.placeholder]="placeholder() || null"
    autocomplete="off"
    (input)="onInput($event)"
  />
</div>
